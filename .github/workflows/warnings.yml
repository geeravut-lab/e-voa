# Official weather warnings reach phones soon: this calls the tick for the "warnings" job every 30 minutes.
# Needs two repository secrets: SITE_URL (e.g. https://e-voa.vercel.app) and CRON_SECRET (the same value as in Vercel). Without them the job does nothing.
name: Weather warning alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  warnings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the warnings job
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET not set: nothing to do"; exit 0; fi
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/tick?only=warnings"
