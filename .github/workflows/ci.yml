# Runs on every push and pull request: the same checks the owner's rules ask for before a change is called done.
# The live tests (real Supabase + simulator) need secrets and are NOT run here; run `npm run e2e:phase1` by hand.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No hex colours outside globals.css
        run: npm run lint:colors
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Start the site and check the public pages with axe (WCAG 2.0/2.1 A and AA)
        run: |
          npm start -- -p 3000 &
          npx --yes wait-on http://localhost:3000/toolkit --timeout 120000
          npm run a11y -- http://localhost:3000
